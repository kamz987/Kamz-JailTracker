<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Jailbreak Hyper Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}header{padding:22px 16px 12px;position:sticky;top:0;background:#080b12ee;z-index:2}h1{margin:0;font-size:25px}.sub{color:#9aa5b5;font-size:13px;margin-top:5px}main{max-width:650px;margin:auto;padding:8px 14px 40px}.card{background:#111722;border:1px solid #202a39;border-radius:18px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-size:19px;font-weight:bold}.robbery{font-size:12px;color:#8f9bad;margin-top:4px}select,input{background:#0a0f18;color:#fff;border:1px solid #2a3547;border-radius:10px;padding:10px;font-size:15px}.count{display:flex;align-items:center;gap:8px;margin-top:15px}.count input{width:105px;text-align:center;font-size:18px;font-weight:bold}button{border:0;border-radius:11px;padding:11px 14px;font-weight:bold}.minus{background:#273140;color:#fff}.plus{background:#f5f7fb;color:#080b12}.up{width:100%;margin-top:11px;background:#5664ff;color:#fff}.up:disabled{opacity:.35}.bar{height:12px;background:#252e3b;border-radius:99px;overflow:hidden;margin:11px 0 7px}.fill{height:100%;background:#7c88ff}.meta{display:flex;justify-content:space-between;font-size:12px;color:#99a4b5}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.add{background:#172033;color:#fff;border:1px solid #2b3850}.danger{background:#30151a;color:#ff9ba5}.total{text-align:center;color:#aeb7c5;font-size:13px;padding:14px 2px}</style></head><body><header><h1>💎 Hyper Tracker</h1><div class="sub">Jailbreak · guardado automático</div>< /header><main id="app"></main><script>
const pity=[225,470,750,870,1335],defs=[["HyperRed","Tomb"],["HyperOrange","Museum"],["HyperYellow","Cargo Train / Passenger Train"],["HyperGreen","Bank"],["HyperBlue","Cargo Plane"],["HyperPurple","Power Plant"],["HyperPink","Crown Jewel"],["HyperDiamond","Jewelry Store"]];
let data=JSON.parse(localStorage.getItem("jht_v2")||"null")||defs.map(x=>({name:x[0],robbery:x[1],level:1,count:0}));
const save=()=>localStorage.setItem("jht_v2",JSON.stringify(data));
function render(){const app=document.getElementById("app");app.innerHTML="";data.forEach((h,i)=>{let max=pity[h.level-1],pct=h.count/max*100,c=document.createElement("section");c.className="card";c.innerHTML=`<div class="top"><div><div class="name">💎 ${h.name}</div><div class="robbery">Robo: ${h.robbery}</div></div><select onchange="lvl(${i},this.value)">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n==h.level?"selected":""}>Nivel ${n}</option>`).join("")}</select></div><div class="count"><button class="minus" onclick="minus(${i})">−1</button><input type="number" min="0" max="${max}" value="${h.count}" onchange="setc(${i},this.value)"><button class="plus" onclick="plus(${i})">+1 ROBO</button></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="meta"><span>${h.count} robos</span><span>${h.level<5?max+" para nivel "+(h.level+1):"Nivel máximo"}</span></div><button class="up" ${h.level>=5||h.count<max?"disabled":""} onclick="up(${i})">${h.level>=5?"Nivel máximo":"Subir al nivel "+(h.level+1)}</button></section>});let t=data.reduce((s,h)=>s+h.count,0);app.insertAdjacentHTML("beforeend",`<div class="total">Total de robos: <b>${t}</b><div class="actions"><button class="add" onclick="add()">＋ Añadir Hyper</button><button class="danger" onclick="resetAll()">Resetear todo</button></div></div>`)}
function lvl(i,v){data[i].level=+v;data[i].count=0;save();render()}function setc(i,v){let m=pity[data[i].level-1];data[i].count=Math.max(0,Math.min(m,parseInt(v)||0));save();render()}function plus(i){let m=pity[data[i].level-1];data[i].count=Math.min(m,data[i].count+1);save();render()}function minus(i){data[i].count=Math.max(0,data[i].count-1);save();render()}function up(i){let h=data[i],m=pity[h.level-1];if(h.count>=m&&h.level<5){h.level++;h.count=0;save();render()}}function add(){let n=prompt("Nombre del Hyperchrome:");if(!n)return;let r=prompt("Robo asociado:")||"Personalizado";data.push({name:n,robbery:r,level:1,count:0});save();render()}function resetAll(){if(confirm("¿Borrar todo el progreso?")){data=defs.map(x=>({name:x[0],robbery:x[1],level:1,count:0}));save();render()}document.getElementById("app").innerHTML="<h2 style='color:white'>JAVASCRIPT FUNCIONA </h2>";</script></body></html>
