<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><link rel="manifest" href="manifest.json"><title>💎 Hyper Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}header{padding:22px 16px 12px;text-align:center}h1{margin:0;font-size:27px}.sub{color:#8f9bad;margin-top:5px;font-size:13px}main{max-width:720px;margin:auto;padding:8px 14px 28px}.card{background:#111722;border:1px solid #202a39;border-radius:18px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:19px;font-weight:700}.robbery{font-size:12px;color:#8f9bad;margin-top:4px}select,input{background:#0a0f18;color:#fff;border:1px solid #2a3547;border-radius:10px;padding:10px;font-size:15px}.count{display:flex;align-items:center;gap:8px;margin-top:15px}.count input{width:105px;text-align:center;font-size:18px;font-weight:700}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700}.minus{background:#273140;color:#fff}.plus{background:#f5f7fb;color:#080b12}.bar{height:12px;background:#252e3b;border-radius:99px;overflow:hidden;margin:11px 0 7px}.fill{height:100%;background:#7c88ff}.meta{display:flex;justify-content:space-between;font-size:12px;color:#99a4b5}.up{width:100%;margin-top:11px;background:#5664ff;color:#fff}.up:disabled{opacity:.35}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.add{background:#172033;color:#fff;border:1px solid #2b3850}.danger{background:#30151a;color:#ff9ba5}.total{text-align:center;color:#aeb7c5;font-size:13px;padding:14px 2px}</style></head><body><header><h1>💎 Hyper Tracker</h1><div class="sub">Jailbreak · guardado automático</div></header><main id="app"></main><script>
(function(){
"use strict";
const PITY=[225,470,750,870,1335];
const DEFAULTS=[["HyperRed","Tomb"],["HyperOrange","Museum"],["HyperYellow","Cargo Train / Passenger Train"],["HyperGreen","Bank"],["HyperBlue","Cargo Plane"],["HyperPurple","Power Plant"],["HyperPink","Crown Jewel"],["HyperDiamond","Jewelry Store"]];
const STORAGE="jht_v3";
function fresh(){return DEFAULTS.map(x=>({name:x[0],robbery:x[1],level:1,count:0}));}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(Array.isArray(s)&&s.length)return s}catch(e){}return fresh();}
let data=load();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const app=document.getElementById("app"); let html="";
 data.forEach((h,i)=>{
  h.level=Math.max(1,Math.min(5,Number(h.level)||1));const max=PITY[h.level-1];h.count=Math.max(0,Math.min(max,Number(h.count)||0));const pct=h.count/max*100;
  html+=`<section class="card"><div class="top"><div><div class="name">💎 ${esc(h.name)}</div><div class="robbery">Robo: ${esc(h.robbery)}</div></div><select data-a="level" data-i="${i}">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===h.level?"selected":""}>Nivel ${n}</option>`).join("")}</select></div><div class="count"><button class="minus" data-a="minus" data-i="${i}">−1</button><input type="number" min="0" max="${max}" value="${h.count}" data-a="count" data-i="${i}"><button class="plus" data-a="plus" data-i="${i}">+1 ROBO</button></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="meta"><span>${h.count} robos</span><span>${h.level<5?max+" para nivel "+(h.level+1):"Nivel máximo"}</span></div><button class="up" ${h.level>=5||h.count<max?"disabled":""} data-a="up" data-i="${i}">${h.level>=5?"Nivel máximo":"Subir al nivel "+(h.level+1)}</button></section>`;
 });
 const total=data.reduce((s,h)=>s+(Number(h.count)||0),0);
 html+=`<div class="total">Total de robos: <b>${total}</b><div class="actions"><button class="add" data-a="add">＋ Añadir Hyper</button><button class="danger" data-a="reset">Resetear todo</button></div></div>`;
 app.innerHTML=html;save();
}
document.getElementById("app").addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;const i=Number(el.dataset.i),a=el.dataset.a;
 if(a==="plus"){data[i].count=Math.min(PITY[data[i].level-1],data[i].count+1);save();render()}
 if(a==="minus"){data[i].count=Math.max(0,data[i].count-1);save();render()}
 if(a==="up"&&data[i].count>=PITY[data[i].level-1]&&data[i].level<5){data[i].level++;data[i].count=0;save();render()}
 if(a==="add"){const n=prompt("Nombre del Hyperchrome:");if(n){data.push({name:n,robbery:prompt("Robo asociado:")||"Personalizado",level:1,count:0});save();render()}}
 if(a==="reset"&&confirm("¿Borrar todo el progreso?")){data=fresh();save();render()}
});
document.getElementById("app").addEventListener("change",e=>{
 const el=e.target,i=Number(el.dataset.i);
 if(el.dataset.a==="level"){data[i].level=+el.value;data[i].count=0;save();render()}
 if(el.dataset.a==="count"){data[i].count=Math.max(0,Math.min(PITY[data[i].level-1],parseInt(el.value)||0));save();render()}
});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script></body></html>
